services:
  ingest:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      PORT: "8090"
      DATABASE_URL: "postgres://secure4k:${POSTGRES_PASSWORD:-secure4k}@postgres:5432/sidecar?sslmode=disable"
      S3_ENDPOINT: "http://minio:9000"
      S3_BUCKET: "sidecar-frames"
      S3_ACCESS_KEY: "${MINIO_ROOT_USER:-minioadmin}"
      S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      S3_REGION: "us-east-1"
      LOCAL_FRAME_PATH: "/data/frames"
      OLLAMA_URL: "http://ollama:11434"
      INFERENCE_MODEL: "${INFERENCE_MODEL:-llava}"
      INFERENCE_THRESHOLD: "${INFERENCE_THRESHOLD:-0.6}"
      SEQUENCENOW_URL: "${SEQUENCENOW_URL:-https://api.sequencenow.com}"
      SEQUENCENOW_API_KEY: "${SEQUENCENOW_API_KEY:-}"
      MQTT_BROKER_URL: "tcp://mosquitto:1883"
      MQTT_TOPIC: "secure4k/frames/+"
      VALID_API_KEYS: "${VALID_API_KEYS:?set VALID_API_KEYS in .env}"
      PIPELINE_WORKERS: "${PIPELINE_WORKERS:-4}"
      PIPELINE_QUEUE_SIZE: "${PIPELINE_QUEUE_SIZE:-1000}"
      RATE_LIMIT_PER_MINUTE: "${RATE_LIMIT_PER_MINUTE:-120}"
      OTA_BUNDLE_PATH: "/data/ota"
    volumes:
      - frame-data:/data/frames
      - ota-data:/data/ota
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: secure4k
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-secure4k}"
      POSTGRES_DB: sidecar
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secure4k -d sidecar"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: "${POSTGRES_PASSWORD:-secure4k}"
    volumes:
      - ./backend/migrations:/migrations:ro
    command: >-
      sh -ec 'for f in /migrations/*.sql; do echo "applying $$f"; psql -h postgres -U secure4k -d sidecar -v ON_ERROR_STOP=1 -f "$$f"; done'
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./backend/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    entrypoint: >-
      /bin/sh -ec 'mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; mc mb local/sidecar-frames --ignore-existing; mc anonymous set none local/sidecar-frames'
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: >-
      /bin/sh -ec 'ollama pull "${INFERENCE_MODEL:-llava}"'
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  pg-data:
  mqtt-data:
  minio-data:
  ollama-data:
  frame-data:
  ota-data:
