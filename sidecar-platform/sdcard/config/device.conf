# ============================================================
# Secure4K Sidecar — Device Configuration
# ============================================================
# Edit these values, then insert the SD card and power cycle.
# ============================================================

# Unique device ID (auto-assigned on first registration)
DEVICE_ID="UNREGISTERED"

# Backend ingest endpoint (your Proxmox 5090 or cloud URL)
BACKEND_URL="https://ingest.secure4k.com"

# API key (generated from Secure4K dashboard)
API_KEY=""

# Capture interval in seconds
# 60  = 1 frame/min  (low bandwidth, gauge monitoring)
# 30  = 2 frames/min (standard security)
# 10  = 6 frames/min (high security, uses more storage)
CAPTURE_INTERVAL=60

# RTSP unlock attempt on boot (1=try, 0=skip)
RTSP_ENABLE=1

# JPEG quality (1-100, lower = smaller files)
FRAME_QUALITY=75

# Max frames to buffer locally when offline
OFFLINE_BUFFER_MAX=500

# OTA update check interval in seconds (3600 = 1 hour)
OTA_CHECK_INTERVAL=3600

# MQTT broker (optional — leave blank to use HTTP POST)
# Example: "192.168.1.100" or "mqtt.yourdomain.com"
MQTT_BROKER=""
MQTT_TOPIC="secure4k/frames"

# WiFi fallback (some cameras lose WiFi after RTSP patch)
WIFI_SSID=""
WIFI_PASS=""
