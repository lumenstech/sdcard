name: Expand pilot source

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/expand-pilot-source.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pilot-hardening
          fetch-depth: 0
      - name: Expand repository package on pilot branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .expand-tmp
          mkdir .expand-tmp
          unzip -q secure4k-sidecar-platform.zip -d .expand-tmp
          top="$(find .expand-tmp -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$top"
          cp -a "$top"/. .
          rm -rf .expand-tmp
          rm -f .github/workflows/expand-package.yml
          git config user.name "secure4k-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: expand packaged sidecar source"
            git push origin HEAD:pilot-hardening
          fi
