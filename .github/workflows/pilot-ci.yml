name: Pilot CI

on:
  push:
    branches: [pilot-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: secure4k
          POSTGRES_PASSWORD: secure4k
          POSTGRES_DB: sidecar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secure4k -d sidecar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://secure4k:secure4k@localhost:5432/sidecar?sslmode=disable
      VALID_API_KEYS: pilot-test-key
      POSTGRES_PASSWORD: secure4k
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: backend/go.sum
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: Resolve Go modules
        working-directory: backend
        run: go mod tidy
      - name: Commit module checksums if generated
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- backend/go.mod backend/go.sum; then
            git config user.name secure4k-release-bot
            git config user.email actions@users.noreply.github.com
            git add backend/go.mod backend/go.sum
            git commit -m 'build: refresh go module checksums'
            git push
          fi
      - name: Apply migration
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/001_initial.sql
      - name: Go vet
        working-directory: backend
        run: go vet ./...
      - name: Go tests
        working-directory: backend
        run: go test ./... -count=1 -race
      - name: Shellcheck
        run: shellcheck -s sh sdcard/initrun.sh sdcard/scripts/*.sh prep-sdcard.sh
      - name: Compose validation
        run: VALID_API_KEYS=pilot-test-key docker compose config --quiet
