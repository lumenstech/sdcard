name: Pilot CI

on:
  push:
    branches: [main, pilot-hardening, post-merge-release-gate]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: secure4k
          POSTGRES_PASSWORD: secure4k
          POSTGRES_DB: sidecar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secure4k -d sidecar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://secure4k:secure4k@localhost:5432/sidecar?sslmode=disable
      VALID_API_KEYS: pilot-test-key
      POSTGRES_PASSWORD: secure4k
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: backend/go.sum
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: Resolve Go modules
        working-directory: backend
        run: go mod tidy
      - name: Commit module checksums if generated
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          if ! git diff --quiet -- backend/go.mod backend/go.sum; then
            git config user.name secure4k-release-bot
            git config user.email actions@users.noreply.github.com
            git add backend/go.mod backend/go.sum
            git commit -m 'build: refresh go module checksums'
            git push
          fi
      - name: Verify main has no module drift
        if: github.ref == 'refs/heads/main'
        run: git diff --exit-code -- backend/go.mod backend/go.sum
      - name: Apply migration
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/001_initial.sql
      - name: Go vet
        working-directory: backend
        run: go vet ./...
      - name: Go tests
        working-directory: backend
        run: go test ./... -count=1 -race
      - name: Shellcheck SD runtime
        run: shellcheck -S warning -e SC1090 -s sh sdcard/initrun.sh sdcard/scripts/*.sh
      - name: Shellcheck prep tool
        run: shellcheck -S warning -e SC2010 -s bash prep-sdcard.sh
      - name: Sidecar reliability assumptions
        run: sh scripts/test-sidecar-assumptions.sh
      - name: Compose validation
        run: VALID_API_KEYS=pilot-test-key docker compose config --quiet

  compose-smoke:
    needs: verify
    runs-on: ubuntu-latest
    env:
      VALID_API_KEYS: pilot-test-key
      POSTGRES_PASSWORD: secure4k
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: pilot-minio-secret
    steps:
      - uses: actions/checkout@v4
      - name: Boot pilot stack
        run: docker compose up -d --build postgres minio mosquitto ollama migrate minio-init ingest
      - name: Wait for ingest health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 http://localhost:8090/health; then exit 0; fi
            sleep 2
          done
          docker compose ps
          docker compose logs ingest postgres migrate minio minio-init mosquitto ollama
          exit 1
      - name: Run pilot smoke
        run: API_KEY=pilot-test-key sh scripts/pilot-smoke.sh
      - name: Verify MinIO evidence
        run: >-
          docker compose run --rm --entrypoint /bin/sh minio-init -ec
          'mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null; test -n "$(mc find local/sidecar-frames --name "*.jpg" | head -n 1)"'
      - name: Show service state
        run: docker compose ps -a
      - name: Cleanup
        if: always()
        run: docker compose down -v
